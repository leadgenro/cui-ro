[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cui-ro"
version = "1.0.0"
description = "Romanian CUI / CIF validation with the official control digit: is_valid, normalize, check_digit, format_vat. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adrian Oaida" }]
keywords = ["cui", "cif", "romania", "vat", "validation", "fiscal-code", "onrc", "anaf"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial",
    "Natural Language :: Romanian",
    "Natural Language :: English",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/leadgenro/cui-ro"
Issues = "https://github.com/leadgenro/cui-ro/issues"

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["cui_ro"]

[tool.setuptools.package-data]
cui_ro = ["py.typed"]
