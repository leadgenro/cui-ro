[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cui-ro"
version = "1.0.0"
description = "Romanian CUI / CIF validation with the official control digit: is_valid, normalize, check_digit, format_vat. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adrian Oaida" }]
keywords = ["cui", "cif", "romania", "vat", "validation", "fiscal-code", "onrc", "anaf"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Natural Language :: Romanian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://leadgen.adrianhomelab.com/?src=cui-ro"
Repository = "https://github.com/leadgenro/cui-ro"
Issues = "https://github.com/leadgenro/cui-ro/issues"

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["cui_ro"]

[tool.setuptools.package-data]
cui_ro = ["py.typed"]
